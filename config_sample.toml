# Minimal starter configuration.
# For optional/advanced settings, see config_sample_advanced.toml.

[api]
# "Bitfinex" or "Poloniex". Bitfinex is the default.
exchange = "Bitfinex"
apikey = "YourAPIKey"
secret = "YourSecret"

# Supported currencies whitelist. Choose based on your exchange.
# Bitfinex:
all_currencies = ["USD", "USDt"]
# Poloniex:
# all_currencies = ["STR", "BTC", "BTS", "CLAM", "DOGE", "DASH", "LTC", "MAID", "XMR", "XRP", "ETH", "FCT"]

[bot]
# Optional dashboard/reporting plugins. Remove these if you do not want history stats/charts.
plugins = ["AccountStats", "Charts"]

# Optional HTTP(S) proxy for all outbound traffic (exchange APIs, currency
# conversion lookups, notifications). Leave unset to keep library defaults;
# HTTP(S)_PROXY environment variables still apply then.
# proxy = "http://127.0.0.1:7890"

# Currency used for dashboard earnings summary.
output_currency = "USD"

# Must be false for the FRR strategy below: with hide_coins = true the bot
# skips FRR currencies entirely (the constructed rate starts below min_daily_rate).
hide_coins = false

[coin.default]
# Minimum daily lending rate in percent.
min_daily_rate = 0.01

# Bitfinex-only FRR strategy. Use config_sample_advanced.toml for Spread tuning.
strategy = "FRR"

[coin.USD]
# Avoid tiny USD offers.
min_loan_size = 150
